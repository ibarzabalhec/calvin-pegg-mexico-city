<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mexico City for Calvin Pegg</title>
<meta name="theme-color" content="#C7365F">
<style>
:root{
  --ink:#2A1610; --paper:#FBF3EC; --night:#1A0F0C;
  --f-d:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;
  --f-b:"Instrument Sans",-apple-system,Helvetica,Arial,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --wall:#C7365F; --tint:#F7DCE3; --deep:#3A0E1C;
}
body[data-a="Roma"]{--wall:#C7365F;--tint:#F7DCE3;--deep:#33101B}
body[data-a="Condesa"]{--wall:#2E5B45;--tint:#DCE9E0;--deep:#0F2219}
body[data-a="Polanco"]{--wall:#A86A1E;--tint:#F4E5C8;--deep:#2B1C08}
body[data-a="Coyoacán"]{--wall:#2340A8;--tint:#DCE2F6;--deep:#0D1638}
:root[data-theme="dark"] body{--tint:color-mix(in oklab,var(--wall) 22%,#14100E);--paper:#14100E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{--tint:color-mix(in oklab,var(--wall) 22%,#14100E);--paper:#14100E}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-b);color:var(--ink);background:var(--deep);transition:background .6s}
a{color:inherit}

/* top: four walls */
.walls{display:flex;height:10px;position:sticky;top:0;z-index:30}
.walls i{flex:1;transition:flex .7s cubic-bezier(.2,.8,.2,1)}
.walls i.on{flex:4}

/* hero wall */
.hero{background:var(--wall);color:#fff;position:relative;overflow:hidden;padding:64px 22px 30px;min-height:58vh;display:flex;flex-direction:column;justify-content:flex-end;transition:background .6s}
.hero .plane{position:absolute;background:rgba(255,255,255,.09);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.hero .p1{right:-12%;top:0;width:58%;height:64%}
.hero .p2{right:18%;top:36%;width:30%;height:64%;background:rgba(0,0,0,.10)}
.hero .p3{left:0;top:0;width:100%;height:6px;background:rgba(255,255,255,.22)}
.city{font:500 12px/1 var(--f-m);letter-spacing:.24em;text-transform:uppercase;opacity:.82;position:relative}
.hero h1{font:italic 400 clamp(84px,27vw,190px)/.9 var(--f-d);letter-spacing:-.035em;margin:14px 0 18px;position:relative;white-space:nowrap;overflow:visible;padding-right:.08em}
.hero .line{font:400 17px/1.4 var(--f-b);max-width:28ch;position:relative;opacity:.95}
.stay{position:relative;display:inline-flex;align-items:center;gap:8px;margin-top:24px;font:500 12px var(--f-m);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:#fff;border-bottom:1px solid rgba(255,255,255,.5);padding-bottom:4px;align-self:flex-start}
.stay svg{width:14px;height:14px}
.theme{position:absolute;top:22px;right:18px;z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.theme svg{width:18px;height:18px}

/* the day: sections deepen from morning to night */
section{--a:0;--b:0;background:color-mix(in oklch,color-mix(in oklch,var(--tint),var(--wall) calc(var(--a)*100%)),var(--deep) calc(var(--b)*100%));color:var(--fg,var(--ink));padding:44px 22px 30px;position:relative;transition:background .6s}
section.dk{--fg:#F8EFE8}
:root[data-theme="dark"] section{--fg:#F3EAE3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) section{--fg:#F3EAE3}}
.sh{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:14px;margin-bottom:12px;max-width:760px;margin-inline:auto}
.sh .ico{width:46px;height:46px;border-radius:50%;background:var(--wall);color:#fff;display:grid;place-items:center}
.sh .ico svg{width:22px;height:22px}
.sh h2{font:italic 400 clamp(34px,9vw,52px)/1 var(--f-d);letter-spacing:-.02em}
.sh .when{font:500 11px/1 var(--f-m);letter-spacing:.18em;text-transform:uppercase;opacity:.62;padding-bottom:7px;text-align:right}
.rows{max-width:760px;margin:0 auto;list-style:none}
.rows a{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:18px 0 19px;border-top:1px solid color-mix(in oklab,currentColor 18%,transparent);text-decoration:none;align-items:start}
.rows li:last-child a{border-bottom:1px solid color-mix(in oklab,currentColor 18%,transparent)}
.nm{font:400 25px/1.1 var(--f-d);letter-spacing:-.01em}
.nm b{font-weight:400;font-style:italic;opacity:.6}
.tg{display:inline-block;margin-left:10px;vertical-align:4px;font:500 10px/1 var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--wall);border:1px solid currentColor;padding:4px 6px 3px;border-radius:3px}
section.dk .tg,:root[data-theme="dark"] .tg{color:color-mix(in oklab,var(--wall),#fff 45%)}
.ds{grid-column:1;font:400 15px/1.5 var(--f-b);opacity:.78;max-width:56ch}
.go{grid-row:1/span 2;grid-column:2;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid color-mix(in oklab,currentColor 30%,transparent);transition:background .2s,color .2s,transform .2s}
.go svg{width:16px;height:16px}
.rows a:hover .go,.rows a:focus-visible .go{background:var(--wall);color:#fff;border-color:var(--wall);transform:rotate(-45deg)}
.rows a:active{opacity:.6}
.rows a:focus-visible{outline:2px solid var(--wall);outline-offset:4px}

/* bottom nav */
nav.areas{position:sticky;bottom:0;z-index:30;display:flex;background:var(--paper);border-top:1px solid color-mix(in oklab,var(--ink) 12%,transparent);padding-bottom:env(safe-area-inset-bottom)}
:root[data-theme="dark"] nav.areas{border-color:#2a221e}
nav.areas button{flex:1;border:0;background:none;padding:12px 2px 13px;font:500 13px var(--f-b);color:color-mix(in oklab,var(--ink) 60%,transparent);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
:root[data-theme="dark"] nav.areas button{color:#a89a90}
nav.areas button i{width:22px;height:8px;border-radius:2px;background:var(--c);transition:width .35s}
nav.areas button.on{color:var(--ink);font-weight:600}
:root[data-theme="dark"] nav.areas button.on{color:#F3EAE3}
nav.areas button.on i{width:40px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.areas{border-color:#2a221e}:root:not([data-theme="light"]) nav.areas button{color:#a89a90}:root:not([data-theme="light"]) nav.areas button.on{color:#F3EAE3}:root:not([data-theme="light"]) .tg{color:color-mix(in oklab,var(--wall),#fff 45%)}}
.end{background:var(--deep);height:40px}

/* intro: the walls rise once a session */
.intro .hero .plane{transform:translateY(105%)}
.intro .hero h1,.intro .hero .line,.intro .hero .city,.intro .stay{opacity:0;transform:translateY(24px)}
.hero h1,.hero .line,.hero .city,.stay{transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.hero .line{transition-delay:.15s}.stay{transition-delay:.25s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:900px){.hero{min-height:64vh;padding:80px max(8vw,calc((100% - 760px)/2)) 44px}section{padding:56px 8vw 40px}}
</style></head>
<body data-a="Roma">
<div class="walls" id="walls" aria-hidden="true"></div>
<header class="hero" id="hero">
  <div class="plane p1"></div><div class="plane p2"></div><div class="plane p3"></div>
  <button class="theme" id="theme" aria-label="Switch light or dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <div class="city">Mexico City · For Calvin Pegg</div>
  <h1 id="h1">Roma</h1>
  <p class="line" id="line"></p>
  <a class="stay" href="https://www.google.com/maps/search/?api=1&query=Casa+Izel+Valladolid+96+Roma+Norte+Mexico+City" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Casa Izel · Valladolid 96</a>
</header>
<main id="day"></main>
<div class="end"></div>
<nav class="areas" id="areas" aria-label="Neighborhoods"></nav>
<script>
const DATA = {"Roma": {"Coffee": [{"n": "Panadería Rosetta", "d": "The bakery from the Rosetta team. Pair a concha or the guava roll with coffee, and expect a line on weekends.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Panaderia+Rosetta+Colima+179+Roma+Norte+Mexico+City"}, {"n": "Cardinal", "d": "Specialty coffee house on Córdoba. A calm espresso stop between Roma blocks.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Cardinal+Casa+de+Caf%C3%A9+C%C3%B3rdoba+132+Roma+Norte+Mexico+City"}, {"n": "Buna", "d": "Roastery in a former textile factory, with an open terrace and plenty of seats. Worth the short ride for the space and the strong coffee.", "t": "Short ride, Doctores", "u": "https://www.google.com/maps/search/?api=1&query=Buna+Doctor+Erazo+172+Mexico+City"}], "Breakfast": [{"n": "Ojo de Agua · Roma", "d": "Fresh juices, chilaquiles and açaí bowls. Order at the counter and expect a line.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Ojo+de+Agua+Zacatecas+177+Roma+Norte+Mexico+City"}, {"n": "Lalo!", "d": "From the Maximo Bistrot team, next to Ojo de Agua. Chilaquiles and the Croque Madame are the usual orders.", "t": "Next to Ojo de Agua", "u": "https://www.google.com/maps/search/?api=1&query=Lalo+Zacatecas+173+Roma+Norte+Mexico+City"}, {"n": "Madre Café", "d": "Long brunch in a restored mansion with a courtyard and a rooftop. Good for a slow morning.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Madre+Cafe+Orizaba+131+Roma+Norte+Mexico+City"}, {"n": "Café Nin", "d": "Egg brioche buns, pastries and coffee. It sits in Juárez, a short ride from Roma, and the weekend wait is real.", "t": "Juárez", "u": "https://www.google.com/maps/search/?api=1&query=Caf%C3%A9+Nin+Havre+73+Ju%C3%A1rez+Mexico+City"}], "Eat": [{"n": "Contramar", "d": "The seafood lunch everyone queues for. Order the tuna tostadas and book ahead.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Contramar+Durango+200+Roma+Norte+Mexico+City"}, {"n": "Rosetta", "d": "Michelin-starred Italian-Mexican cooking in a historic Roma house, from chef Elena Reygadas. Book ahead.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Rosetta+Colima+166+Roma+Norte+Mexico+City"}, {"n": "Maximo Bistrot", "d": "Chef Eduardo García's seasonal market menu. A Roma favorite for lunch or dinner.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Maximo+Bistrot+Tonala+133+Roma+Norte+Mexico+City"}, {"n": "Expendio de Maíz", "d": "Heirloom corn, no menu, no reservations and cash only. Eat what they are cooking that day.", "t": "Cash", "u": "https://www.google.com/maps/search/?api=1&query=Expendio+de+Maiz+Avenida+Yucatan+84+Roma+Norte+Mexico+City"}, {"n": "La Once Mil · Roma", "d": "The star taquería, Roma branch. Walk-ins only.", "t": "Option A", "u": "https://www.google.com/maps/search/?api=1&query=La+Once+Mil+Orizaba+83+Roma+Norte+Mexico+City"}, {"n": "Rokai", "d": "Sushi izakaya with a daily changing menu, just north of Reforma.", "t": "Short ride", "u": "https://www.google.com/maps/search/?api=1&query=Rokai+Rio+Ebro+87+Mexico+City"}, {"n": "Blanco Colima", "d": "Dressed-up dinner in a Porfirian mansion, next door to Rosetta.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Blanco+Colima+Colima+168+Roma+Norte+Mexico+City"}, {"n": "El Tigre Silencioso", "d": "Northern cantina in a gorgeous house. Late dinner and shareable plates.", "t": "Trendy", "u": "https://www.google.com/maps/search/?api=1&query=El+Tigre+Silencioso+Colima+159+Roma+Norte+Mexico+City"}, {"n": "Babero", "d": "Italian-leaning dinner with pastas and a tableside Caesar. The Biberón bar is upstairs.", "t": "Biberón upstairs", "u": "https://www.google.com/maps/search/?api=1&query=Babero+Durango+219+Roma+Norte+Mexico+City"}, {"n": "Propio", "d": "Chef-driven dinner on Álvaro Obregón.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Propio+restaurante+Alvaro+Obregon+182+Roma+Norte+Mexico+City"}], "Late tacos": [{"n": "Taquería Orinoco", "d": "Pastor, res and chicharrón tacos with crispy potatoes. The late-night Roma classic.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Taqueria+Orinoco+Alvaro+Obregon+65+Roma+Norte+Mexico+City"}, {"n": "Tacos Atarantados", "d": "Northern-style trompo tacos and cachetadas. Open until 3am on weekends.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Tacos+Atarantados+Cordoba+113+Roma+Norte+Mexico+City"}, {"n": "El Califa", "d": "The chain, in its Condesa branch. Reliable tacos and open late.", "t": "Condesa", "u": "https://www.google.com/maps/search/?api=1&query=Taquer%C3%ADa+El+Califa+Altata+22+Condesa+Mexico+City"}, {"n": "El Farolito", "d": "Reliable late-night taco stop in Condesa.", "t": "Condesa", "u": "https://www.google.com/maps/search/?api=1&query=Taquer%C3%ADa+El+Farolito+Altata+19+Condesa+Mexico+City"}], "Drinks": [{"n": "La Mezcalería", "d": "Mezcal bar by the Cibeles fountain.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=La+Mezcaleria+Monterrey+47+Roma+Norte+Mexico+City"}, {"n": "Departamento", "d": "Multi-floor club with a rooftop and an international crowd.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Departamento+Alvaro+Obregon+154+Roma+Norte+Mexico+City"}, {"n": "Bar Oriente", "d": "Electronic music nights on Durango.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Bar+Oriente+Durango+181+Roma+Norte+Mexico+City"}, {"n": "Biberón", "d": "Vinyl speakeasy upstairs from Babero. Open Wednesday to Saturday from 7pm.", "t": "Above Babero", "u": "https://www.google.com/maps/search/?api=1&query=Biberon+bar+Durango+219+Roma+Norte+Mexico+City"}, {"n": "Hanky Panky", "d": "World-ranked speakeasy in Juárez. Reserve ahead.", "t": "Reserve", "u": "https://www.google.com/maps/search/?api=1&query=Hanky+Panky+Tur%C3%ADn+52+Ju%C3%A1rez+Mexico+City"}, {"n": "Handshake Speakeasy", "d": "World-ranked cocktails in Juárez behind a door marked 13.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Handshake+Speakeasy+Amberes+65+Ju%C3%A1rez+Mexico+City"}, {"n": "Palapa Cantina Caribeña", "d": "Open-air Caribbean cantina under a palapa roof, behind an iron door on Versalles. Cuban rum cocktails and shared plates from Yucatán to Colombia.", "t": "Juárez", "u": "https://www.google.com/maps/search/?api=1&query=Palapa+Cantina+Caribe%C3%B1a+Versalles+113+Ju%C3%A1rez+Mexico+City"}, {"n": "Salón Ríos", "d": "Old western saloon meets speakeasy, near Reforma.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Sal%C3%B3n+R%C3%ADos+R%C3%ADo+Lerma+218+Cuauht%C3%A9moc+Mexico+City"}], "Out late": [{"n": "Cometa", "d": "The hot club in Roma. Tough door and the guest list helps. Thursday to Saturday.", "t": "Tough door", "u": "https://www.google.com/maps/search/?api=1&query=Cometa+Cordoba+104+Roma+Norte+Mexico+City"}, {"n": "Café Paraíso", "d": "Nightclub on Plaza Villa de Madrid.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Caf%C3%A9+Para%C3%ADso+Plaza+de+Villa+de+Madrid+17+Roma+Mexico+City"}, {"n": "Antro Juan", "d": "House, reggaeton and regional music in one room.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Antro+Juan+%C3%81lvaro+Obreg%C3%B3n+287+Roma+Norte+Mexico+City"}, {"n": "Mama Rumba", "d": "Latin dance nights with live music.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Mama+Rumba+Quer%C3%A9taro+230+Roma+Norte+Mexico+City"}]}, "Condesa": {"Coffee": [{"n": "Maque", "d": "Pastry shop across from Parque México. The concha is the order.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Maque+Avenida+Ozuluama+4+Hip%C3%B3dromo+Condesa+Mexico+City"}, {"n": "Tierra Garat · Condesa", "d": "Mexican coffee and chocolate in a terracotta room.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Tierra+Garat+Nuevo+Leon+122+Hipodromo+Mexico+City"}, {"n": "Nevería Roxy · Condesa", "d": "The original 1946 ice cream counter. Go for dessert after a walk in the park.", "t": "Original", "u": "https://www.google.com/maps/search/?api=1&query=Neveria+Roxy+Fernando+Montes+de+Oca+89+Condesa+Mexico+City"}], "Breakfast": [{"n": "Cedrón", "d": "French brasserie with a Mexican twist on Avenida Mazatlán, open from 8am. Croque madame, pan francés and a bakery counter.", "t": "From 8am", "u": "https://www.google.com/maps/search/?api=1&query=Cedr%C3%B3n+Mazatl%C3%A1n+24+Condesa+Mexico+City"}], "Eat": [{"n": "Lardo", "d": "Italian-Mediterranean on Agustín Melgar, open for breakfast and dinner.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Lardo+Agustin+Melgar+6+Condesa+Mexico+City"}, {"n": "Feral", "d": "Chef Paola Sepúlveda's restaurant across from Parque México, mixing French, Asian and Mexican influences. Opens at 2pm.", "t": "From 2pm", "u": "https://www.google.com/maps/search/?api=1&query=Feral+restaurante+Avenida+M%C3%A9xico+157+Condesa+Mexico+City"}, {"n": "Azul Condesa", "d": "Chef Ricardo Muñoz Zurita's traditional Mexican cooking, with a patio, mezcal and Mexican wine. Breakfast Wednesday to Sunday, 9 to noon.", "t": "Breakfast Wed to Sun", "u": "https://www.google.com/maps/search/?api=1&query=Azul+Condesa+Nuevo+Le%C3%B3n+68+Condesa+Mexico+City"}, {"n": "Baldío", "d": "Mexico City's Michelin Green Star, a zero-waste dinner. Open Tuesday to Sunday.", "t": "Tue to Sun", "u": "https://www.google.com/maps/search/?api=1&query=Baldio+Antonio+Sola+26+Condesa+Mexico+City"}], "Drinks": [{"n": "Lucky", "d": "Rooftop bar in the Rodona Hotel with Parque México views. Opens at 1pm.", "t": "From 1pm", "u": "https://www.google.com/maps/search/?api=1&query=Lucky+bar+Avenida+Mexico+31+Condesa+Mexico+City"}, {"n": "Condesa df rooftop", "d": "Early evening drinks on the hotel roof. Closes 11pm, 12:30am Thursday to Saturday.", "t": "Early", "u": "https://www.google.com/maps/search/?api=1&query=Condesa+df+Veracruz+102+Mexico+City"}], "Walk": [{"n": "Parque México", +Barra+Aristoteles+124+Polanco+Mexico+City"}, {"n": "El Japonez", "d": "Japanese on Emilio Castelar, in the same building as Librería Castelar.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=El+Japonez+Emilio+Castelar+135+Polanco+Mexico+City"}, {"n": "Tori Tori", "d": "Japanese classic. The flagship is on Temístocles and there is a branch on Anatole France.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Tori+Tori+Temistocles+61+Polanco+Mexico+City"}, {"n": "Prosecco", "d": "Italian on Virgilio, in Polanquito.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Prosecco+Virgilio+7+Polanco+Mexico+City"}, {"n": "Dante Brasa y Fuego", "d": "Wood-fired steakhouse on Edgar Allan Poe.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Dante+Brasa+y+Fuego+Edgar+Allan+Poe+41+Polanco+Mexico+City"}], "Drinks": [{"n": "Librería Castelar", "d": "Speakeasy behind a bookshelf, in the same building as El Japonez.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Libreria+Castelar+Emilio+Castelar+135+Polanco+Mexico+City"}, {"n": "Limantour · Polanco", "d": "Cocktail bar on Oscar Wilde.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Licoreria+Limantour+Oscar+Wilde+9+Polanco+Mexico+City"}, {"n": "Café Drama", "d": "Enter through a café. Karaoke, tarot and pizza. Wednesday to Saturday, reserve.", "t": "Reserve", "u": "https://www.google.com/maps/search/?api=1&query=Cafe+Drama+Tennyson+117+Polanco+Mexico+City"}], "Museums & shopping": [{"n": "Museo Jumex", "d": "Contemporary art, next to Soumaya.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Museo+Jumex+Mexico+City"}, {"n": "Museo Soumaya", "d": "Free, silver-tiled and six floors of art.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Museo+Soumaya+Mexico+City"}, {"n": "Antara", "d": "Open-air mall near Jumex and Soumaya.", "t": "Shopping", "u": "https://www.google.com/maps/search/?api=1&query=Antara+Fashion+Hall+Mexico+City"}, {"n": "Museo Nacional de Antropología", "d": "In Chapultepec. The big one.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Museo+Nacional+de+Antropologia+Mexico+City"}]}, "Coyoacán": {"Go": [{"n": "Casa Azul", "d": "Frida Kahlo's house. Your first visit, so book tickets ahead.", "t": "Book ahead", "u": "https://www.google.com/maps/search/?api=1&query=Museo+Frida+Kahlo+Casa+Azul+Coyoacan+Mexico+City"}, {"n": "Mercado de Coyoacán", "d": "Market food and crafts a few blocks south of Casa Azul.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Mercado+de+Coyoacan+Mexico+City"}]}};
const LINE={"Roma":"Home base. Almost all of it is a walk.","Condesa":"Next door, around Parque México.","Polanco":"Polanquito around Parque Lincoln, and the museums north of it.","Coyoacán":"A trek from Roma, and worth it. Pair Casa Azul with the market."};
const WALL={"Roma":"#C7365F","Condesa":"#2E5B45","Polanco":"#A86A1E","Coyoacán":"#2340A8"};
const WHEN={"Coffee":"Morning","Breakfast":"Morning","Eat":"Lunch · Dinner","Late tacos":"After midnight","Drinks":"Evening","Out late":"Night","Walk":"Afternoon","Polanquito":"Daytime","Museums & shopping":"Daytime","Go":"Half a day"};
const S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">';
const ICON={
 "Coffee":S+'<path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3"/></svg>',
 "Breakfast":S+'<path d="M3 17h18"/><path d="M6 17a6 6 0 0 1 12 0"/><path d="M12 5v2M5 8l1.4 1.4M19 8l-1.4 1.4"/></svg>',
 "Eat":S+'<path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5a2 2 0 0 0 2 2M9 3v5a2 2 0 0 1-2 2"/><path d="M17 21V3c-2 1-3 4-3 8h3"/></svg>',
 "Late tacos":S+'<path d="M3 16a9 9 0 0 1 18 0z"/><path d="M7 12c1 1 2 1 3 0s2-1 3 0 2 1 3 0"/></svg>',
 "Drinks":S+'<path d="M5 4h14l-7 8z"/><path d="M12 12v7M8 20h8"/><path d="M15 7l3-4"/></svg>',
 "Out late":S+'<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>',
 "Walk":S+'<path d="M12 3c-3 3-5 5.5-5 8.5a5 5 0 0 0 10 0C17 8.5 15 6 12 3z"/><path d="M12 21v-8"/></svg>',
 "Polanquito":S+'<path d="M12 3c-3 3-5 5.5-5 8.5a5 5 0 0 0 10 0C17 8.5 15 6 12 3z"/><path d="M12 21v-8"/></svg>',
 "Museums & shopping":S+'<path d="M3 9l9-5 9 5"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>',
 "Go":S+'<path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>'};
const ARROW=S+'<path d="M5 12h14M13 6l6 6-6 6"/></svg>';
let area="Roma";
try{const a=localStorage.getItem("mx-area");if(DATA[a])area=a}catch(e){}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function name(n){const i=n.indexOf(" · ");return i<0?esc(n):esc(n.slice(0,i))+" <b>"+esc(n.slice(i+3))+"</b>"}
function render(){
  document.body.dataset.a=area;
  document.querySelector('meta[name=theme-color]').content=WALL[area];
  document.getElementById("walls").innerHTML=Object.keys(DATA).map(a=>`<i class="${a===area?'on':''}" style="background:${WALL[a]}"></i>`).join("");
  document.getElementById("h1").textContent=area;fit();
  document.getElementById("line").textContent=LINE[area];
  const cats=Object.keys(DATA[area]),n=cats.length;
  document.getElementById("day").innerHTML=cats.map((c,i)=>{
    const x=n>1?i/(n-1):0,a=Math.min(x*1.25,.5)*(n>2?1:.5),b=n>2?Math.max(0,(x-.4)/.6)*.9:0;
    return `<section style="--a:${a.toFixed(3)};--b:${b.toFixed(3)}" class="${(a>=.42||b>.3)?'dk':''}"><div class="sh"><span class="ico">${ICON[c]||ICON.Go}</span><h2>${esc(c)}</h2><span class="when">${esc(WHEN[c]||"")}</span></div><ul class="rows">`+
    DATA[area][c].map(p=>`<li><a href="${esc(p.u)}" target="_blank" rel="noopener"><span class="nm">${name(p.n)}${p.t?`<span class="tg">${esc(p.t)}</span>`:""}</span><span class="ds">${esc(p.d)}</span><span class="go">${ARROW}</span></a></li>`).join("")+`</ul></section>`}).join("");
  const nav=document.getElementById("areas");
  nav.innerHTML=Object.keys(DATA).map(a=>`<button class="${a===area?'on':''}" data-a="${a}" style="--c:${WALL[a]}"><i></i>${a}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.dataset.a===area)return;area=b.dataset.a;try{localStorage.setItem("mx-area",area)}catch(e){}render();window.scrollTo({top:0})});
}
function fit(){const h=document.getElementById('h1');h.style.fontSize='';let s=parseFloat(getComputedStyle(h).fontSize);while(h.scrollWidth>h.clientWidth+1&&s>40){s-=4;h.style.fontSize=s+'px'}}
addEventListener('resize',fit);if(document.fonts)document.fonts.ready.then(fit);
/* theme */
const root=document.documentElement;
try{const t=localStorage.getItem("mx-theme");if(t)root.dataset.theme=t}catch(e){}
document.getElementById("theme").onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;root.dataset.theme=dark?"light":"dark";try{localStorage.setItem("mx-theme",root.dataset.theme)}catch(e){}};
/* intro once a session */
let first=true;try{first=!sessionStorage.getItem("mx-intro");sessionStorage.setItem("mx-intro","1")}catch(e){}
if(first&&!matchMedia("(prefers-reduced-motion: reduce)").matches){document.body.classList.add("intro");requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>document.body.classList.remove("intro"),60)))}
render();
/* fonts, non-blocking */
const l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap";document.head.appendChild(l);
</script></body></html>
