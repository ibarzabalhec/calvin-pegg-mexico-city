<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mexico City for Calvin Pegg</title>
<style>
:root{--clay:#B5502F;--clay-d:#8E3A1F;--deep:#5E2412;--sand:#F4E9DC;--cream:#FBF5EC;--ink:#2B1A12;--mute:#7C6150;--line:#E6D5C2;--gold:#D9A441}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Georgia,'Times New Roman',serif;background:var(--cream);color:var(--ink);-webkit-text-size-adjust:100%}
.hero{background:radial-gradient(120% 140% at 85% 0%,#D9743F 0%,var(--clay) 45%,var(--deep) 100%);color:var(--cream);padding:56px 22px 34px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;bottom:-90px;width:260px;height:260px;border-radius:50%;border:2px solid rgba(251,245,236,.18);box-shadow:0 0 0 28px rgba(251,245,236,.06),0 0 0 60px rgba(251,245,236,.04)}
.eyebrow{font:600 12px -apple-system,Helvetica,sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.8}
h1{font-size:clamp(46px,13vw,76px);font-weight:400;line-height:.98;margin:10px 0 14px;letter-spacing:-.01em}
.lede{font:16px/1.4 -apple-system,Helvetica,sans-serif;opacity:.92;max-width:30ch;position:relative;z-index:1}
.stay{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font:500 13px -apple-system,Helvetica,sans-serif;background:rgba(251,245,236,.14);padding:8px 14px;border-radius:999px;color:var(--cream);text-decoration:none;position:relative;z-index:1}
.stay svg{width:14px;height:14px;fill:var(--cream)}
.bar{position:sticky;top:0;z-index:10;background:var(--cream);border-bottom:1px solid var(--line)}
nav.tabs{display:flex;max-width:760px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;padding:16px 4px 13px;font:600 15px -apple-system,Helvetica,sans-serif;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--clay-d);border-color:var(--clay)}
nav.jump{display:flex;gap:8px;overflow-x:auto;max-width:760px;margin:0 auto;padding:0 16px 12px;scrollbar-width:none}
nav.jump::-webkit-scrollbar{display:none}
nav.jump a{flex:none;font:500 13px -apple-system,Helvetica,sans-serif;color:var(--clay-d);background:var(--sand);padding:7px 14px;border-radius:999px;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:8px 16px 80px}
.intro{font:16px/1.45 Georgia,serif;font-style:italic;color:var(--clay-d);padding:22px 4px 4px}
section{padding-top:34px;scroll-margin-top:118px}
.sh{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;padding:0 4px}
.num{font:400 40px/1 Georgia,serif;color:var(--clay);opacity:.35}
.sh h2{font-size:30px;font-weight:400;line-height:1.05}
.when{font:600 11px -apple-system,Helvetica,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.sh .ct{margin-left:auto;font:600 12px -apple-system,Helvetica,sans-serif;color:var(--mute);background:var(--sand);border-radius:999px;padding:5px 11px}
.card{display:flex;align-items:flex-start;gap:14px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--clay);border-radius:16px;padding:17px 16px 17px 18px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:0 1px 0 rgba(94,36,18,.04),0 8px 22px -14px rgba(94,36,18,.35);transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 26px -14px rgba(94,36,18,.5)}
.card:active{background:var(--sand)}
.body{flex:1;min-width:0}
.name{font-size:22px;line-height:1.15}
.tag{display:inline-block;margin-top:7px;font:700 10px -apple-system,Helvetica,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--clay);border-radius:6px;padding:4px 8px}
.desc{font:15px/1.45 -apple-system,Helvetica,sans-serif;color:var(--mute);margin-top:8px}
.pin{flex:none;width:44px;height:44px;border-radius:50%;background:var(--sand);display:grid;place-items:center;margin-top:2px}
.pin svg{width:21px;height:21px;fill:var(--clay)}
.card:hover .pin{background:var(--clay)}
.card:hover .pin svg{fill:#fff}
footer{text-align:center;font:13px -apple-system,Helvetica,sans-serif;color:var(--mute);padding:10px 0 50px}
</style></head><body>
<header class="hero"><div class="eyebrow">Mexico City</div><h1>For Calvin Pegg</h1>
<p class="lede">Where to eat, drink and go. Tap any name to open it in Google Maps.</p>
<a class="stay" href="https://www.google.com/maps/search/?api=1&query=Casa+Izel+Valladolid+96+Roma+Norte+Mexico+City" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Casa Izel, Valladolid 96</a></header>
<div class="bar"><nav class="tabs" id="tabs"></nav><nav class="jump" id="jump"></nav></div>
<main><div id="intro"></div><div id="list"></div></main>
<footer>Compiled by Héctor</footer>
<script>
const DATA = {"Roma": {"Coffee": [{"n": "Panadería Rosetta", "d": "The bakery from the Rosetta team. Pair a concha or the guava roll with coffee, and expect a line on weekends.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Panaderia+Rosetta+Colima+179+Roma+Norte+Mexico+City"}, {"n": "Cardinal", "d": "Specialty coffee house on Córdoba. A calm espresso stop between Roma blocks.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Cardinal+Casa+de+Caf%C3%A9+C%C3%B3rdoba+132+Roma+Norte+Mexico+City"}, {"n": "Buna", "d": "Roastery in a former textile factory, with an open terrace and plenty of seats. Worth the short ride for the space and the strong coffee.", "t": "Short ride, Doctores", "u": "https://www.google.com/maps/search/?api=1&query=Buna+Doctor+Erazo+172+Mexico+City"}], "Breakfast": [{"n": "Ojo de Agua · Roma", "d": "Fresh juices, chilaquiles and açaí bowls. Order at the counter and expect a line.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Ojo+de+Agua+Zacatecas+177+Roma+Norte+Mexico+City"}, {"n": "Lalo!", "d": "From the Maximo Bistrot team, next to Ojo de Agua. Chilaquiles and the Croque Madame are the usual orders.", "t": "Next to Ojo de Agua", "u": "https://www.google.com/maps/search/?api=1&query=Lalo+Zacatecas+173+Roma+Norte+Mexico+City"}, {"n": "Madre Café", "d": "Long brunch in a restored mansion with a courtyard and a rooftop. Good for a slow morning.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Madre+Cafe+Orizaba+131+Roma+Norte+Mexico+City"}, {"n": "Café Nin", "d": "Egg brioche buns, pastries and coffee. It sits in Juárez, a short ride from Roma, and the weekend wait is real.", "t": "Juárez", "u": "https://www.google.com/maps/search/?api=1&query=Caf%C3%A9+Nin+Havre+73+Ju%C3%A1rez+Mexico+City"}], "Eat": [{"n": "Contramar", "d": "The seafood lunch everyone queues for. Order the tuna tostadas and book ahead.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Contramar+Durango+200+Roma+Norte+Mexico+City"}, {"n": "Rosetta", "d": "Michelin-starred Italian-Mexican cooking in a historic Roma house, from chef Elena Reygadas. Book ahead.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Rosetta+Colima+166+Roma+Norte+Mexico+City"}, {"n": "Maximo Bistrot", "d": "Chef Eduardo García's seasonal market menu. A Roma favorite for lunch or dinner.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Maximo+Bistrot+Tonala+133+Roma+Norte+Mexico+City"}, {"n": "Expendio de Maíz", "d": "Heirloom corn, no menu, no reservations and cash only. Eat what they are cooking that day.", "t": "Cash", "u": "https://www.google.com/maps/search/?api=1&query=Expendio+de+Maiz+Avenida+Yucatan+84+Roma+Norte+Mexico+City"}, {"n": "La Once Mil · Roma", "d": "The star taquería, Roma branch. Walk-ins only.", "t": "Option A", "u": "https://www.google.com/maps/search/?api=1&query=La+Once+Mil+Orizaba+83+Roma+Norte+Mexico+City"}, {"n": "Rokai", "d": "Sushi izakaya with a daily changing menu, just north of Reforma.", "t": "Short ride", "u": "https://www.google.com/maps/search/?api=1&query=Rokai+Rio+Ebro+87+Mexico+City"}, {"n": "Blanco Colima", "d": "Dressed-up dinner in a Porfirian mansion, next door to Rosetta.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Blanco+Colima+Colima+168+Roma+Norte+Mexico+City"}, {"n": "El Tigre Silencioso", "d": "Northern cantina in a gorgeous house. Late dinner and shareable plates.", "t": "Trendy", "u": "https://www.google.com/maps/search/?api=1&query=El+Tigre+Silencioso+Colima+159+Roma+Norte+Mexico+City"}, {"n": "Babero", "d": "Italian-leaning dinner with pastas and a tableside Caesar. The Biberón bar is upstairs.", "t": "Biberón upstairs", "u": "https://www.google.com/maps/search/?api=1&query=Babero+Durango+219+Roma+Norte+Mexico+City"}, {"n": "Propio", "d": "Chef-driven dinner on Álvaro Obregón.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Propio+restaurante+Alvaro+Obregon+182+Roma+Norte+Mexico+City"}], "Late tacos": [{"n": "Taquería Orinoco", "d": "Pastor, res and chicharrón tacos with crispy potatoes. The late-night Roma classic.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Taqueria+Orinoco+Alvaro+Obregon+65+Roma+Norte+Mexico+City"}, {"n": "Tacos Atarantados", "d": "Northern-style trompo tacos and cachetadas. Open until 3am on weekends.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Tacos+Atarantados+Cordoba+113+Roma+Norte+Mexico+City"}, {"n": "El Califa", "d": "The chain, in its Condesa branch. Reliable tacos and open late.", "t": "Condesa", "u": "https://www.google.com/maps/search/?api=1&query=Taquer%C3%ADa+El+Califa+Altata+22+Condesa+Mexico+City"}, {"n": "El Farolito", "d": "Reliable late-night taco stop in Condesa.", "t": "Condesa", "u": "https://www.google.com/maps/search/?api=1&query=Taquer%C3%ADa+El+Farolito+Altata+19+Condesa+Mexico+City"}], "Drinks": [{"n": "La Mezcalería", "d": "Mezcal bar by the Cibeles fountain.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=La+Mezcaleria+Monterrey+47+Roma+Norte+Mexico+City"}, {"n": "Departamento", "d": "Multi-floor club with a rooftop and an international crowd.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Departamento+Alvaro+Obregon+154+Roma+Norte+Mexico+City"}, {"n": "Bar Oriente", "d": "Electronic music nights on Durango.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Bar+Oriente+Durango+181+Roma+Norte+Mexico+City"}, {"n": "Biberón", "d": "Vinyl speakeasy upstairs from Babero. Open Wednesday to Saturday from 7pm.", "t": "Above Babero", "u": "https://www.google.com/maps/search/?api=1&query=Biberon+bar+Durango+219+Roma+Norte+Mexico+City"}, {"n": "Hanky Panky", "d": "World-ranked speakeasy in Juárez. Reserve ahead.", "t": "Reserve", "u": "https://www.google.com/maps/search/?api=1&query=Hanky+Panky+Tur%C3%ADn+52+Ju%C3%A1rez+Mexico+City"}, {"n": "Handshake Speakeasy", "d": "World-ranked cocktails in Juárez behind a door marked 13.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Handshake+Speakeasy+Amberes+65+Ju%C3%A1rez+Mexico+City"}, {"n": "Salón Ríos", "d": "Old western saloon meets speakeasy, near Reforma.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Sal%C3%B3n+R%C3%ADos+R%C3%ADo+Lerma+218+Cuauht%C3%A9moc+Mexico+City"}], "Out late": [{"n": "Cometa", "d": "The hot club in Roma. Tough door and the guest list helps. Thursday to Saturday.", "t": "Tough door", "u": "https://www.google.com/maps/search/?api=1&query=Cometa+Cordoba+104+Roma+Norte+Mexico+City"}, {"n": "Café Paraíso", "d": "Nightclub on Plaza Villa de Madrid.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Caf%C3%A9+Para%C3%ADso+Plaza+de+Villa+de+Madrid+17+Roma+Mexico+City"}, {"n": "Antro Juan", "d": "House, reggaeton and regional music in one room.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Antro+Juan+%C3%81lvaro+Obreg%C3%B3n+287+Roma+Norte+Mexico+City"}, {"n": "Mama Rumba", "d": "Latin dance nights with live music.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Mama+Rumba+Quer%C3%A9taro+230+Roma+Norte+Mexico+City"}]}, "Condesa": {"Coffee": [{"n": "Maque", "d": "Pastry shop across from Parque México. The concha is the order.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Maque+Avenida+Ozuluama+4+Hip%C3%B3dromo+Condesa+Mexico+City"}, {"n": "Tierra Garat · Condesa", "d": "Mexican coffee and chocolate in a terracotta room.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Tierra+Garat+Nuevo+Leon+122+Hipodromo+Mexico+City"}, {"n": "Nevería Roxy · Condesa", "d": "The original 1946 ice cream counter. Go for dessert after a walk in the park.", "t": "Original", "u": "https://www.google.com/maps/search/?api=1&query=Neveria+Roxy+Fernando+Montes+de+Oca+89+Condesa+Mexico+City"}], "Breakfast": [{"n": "Cedrón", "d": "French brasserie with a Mexican twist on Avenida Mazatlán, open from 8am. Croque madame, pan francés and a bakery counter.", "t": "From 8am", "u": "https://www.google.com/maps/search/?api=1&query=Cedr%C3%B3n+Mazatl%C3%A1n+24+Condesa+Mexico+City"}], "Eat": [{"n": "Lardo", "d": "Italian-Mediterranean on Agustín Melgar, open for breakfast and dinner.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Lardo+Agustin+Melgar+6+Condesa+Mexico+City"}, {"n": "Feral", "d": "Chef Paola Sepúlveda's restaurant across from Parque México, mixing French, Asian and Mexican influences. Opens at 2pm.", "t": "From 2pm", "u": "https://www.google.com/maps/search/?api=1&query=Feral+restaurante+Avenida+M%C3%A9xico+157+Condesa+Mexico+City"}, {"n": "Azul Condesa", "d": "Chef Ricardo Muñoz Zurita's traditional Mexican cooking, with a patio, mezcal and Mexican wine. Breakfast Wednesday to Sunday, 9 to noon.", "t": "Breakfast Wed to Sun", "u": "https://www.google.com/maps/search/?api=1&query=Azul+Condesa+Nuevo+Le%C3%B3n+68+Condesa+Mexico+City"}, {"n": "Baldío", "d": "Mexico City's Michelin Green Star, a zero-waste dinner. Open Tuesday to Sunday.", "t": "Tue to Sun", "u": "https://www.google.com/maps/search/?api=1&query=Baldio+Antonio+Sola+26+Condesa+Mexico+City"}], "Drinks": [{"n": "Lucky", "d": "Rooftop bar in the Rodona Hotel with Parque México views. Opens at 1pm.", "t": "From 1pm", "u": "https://www.google.com/maps/search/?api=1&query=Lucky+bar+Avenida+Mexico+31+Condesa+Mexico+City"}, {"n": "Condesa df rooftop", "d": "Early evening drinks on the hotel roof. Closes 11pm, 12:30am Thursday to Saturday.", "t": "Early", "u": "https://www.google.com/maps/search/?api=1&query=Condesa+df+Veracruz+102+Mexico+City"}], "Walk": [{"n": "Parque México", "d": "The art deco park at the center of Condesa. Walk it between meals.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Parque+Mexico+Condesa+Mexico+City"}]}, "Polanco": {"Polanquito": [{"n": "Parque Lincoln", "d": "The green anchor of Polanquito. Everything else in this list is a few minutes away.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Parque+Lincoln+Emilio+Castelar+Polanco+Mexico+City"}, {"n": "El Péndulo", "d": "Bookstore café with a pendulum hanging in the middle. The photo spot.", "t": "Photos", "u": "https://www.google.com/maps/search/?api=1&query=Cafebreria+El+Pendulo+Alejandro+Dumas+81+Polanco+Mexico+City"}, {"n": "Churrería El Moro", "d": "Churros and hot chocolate.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Churreria+El+Moro+Julio+Verne+90+Polanco+Mexico+City"}, {"n": "Nevería Roxy · Polanco", "d": "Ice cream by the park, next to El Moro.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Neveria+Roxy+Julio+Verne+84+Polanco+Mexico+City"}, {"n": "Tierra Garat · Masaryk", "d": "Same terracotta coffee shop, Polanco branch.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Tierra+Garat+Presidente+Masaryk+86+Polanco+Mexico+City"}], "Eat": [{"n": "La Bonvi · Polanco", "d": "Picaña tacos and a dressed-up crowd.", "t": "Option A", "u": "https://www.google.com/maps/search/?api=1&query=La+Bonvi+Anatole+France+139+Polanco+Mexico+City"}, {"n": "La Bonvi · Lomas", "d": "Second branch on Pedregal.", "t": "Option B", "u": "https://www.google.com/maps/search/?api=1&query=La+Bonvi+Pedregal+33+Lomas+Virreyes+Mexico+City"}, {"n": "La Once Mil · Lomas", "d": "The original Michelin-starred branch.", "t": "Option B", "u": "https://www.google.com/maps/search/?api=1&query=La+Once+Mil+Monte+Everest+780+Lomas+de+Chapultepec+Mexico+City"}, {"n": "La Buena Barra", "d": "Contemporary cantina on Masaryk and Aristóteles.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=La+Buena+Barra+Aristoteles+124+Polanco+Mexico+City"}, {"n": "El Japonez", "d": "Japanese on Emilio Castelar, in the same building as Librería Castelar.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=El+Japonez+Emilio+Castelar+135+Polanco+Mexico+City"}, {"n": "Tori Tori", "d": "Japanese classic. The flagship is on Temístocles and there is a branch on Anatole France.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Tori+Tori+Temistocles+61+Polanco+Mexico+City"}, {"n": "Prosecco", "d": "Italian on Virgilio, in Polanquito.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Prosecco+Virgilio+7+Polanco+Mexico+City"}, {"n": "Dante Brasa y Fuego", "d": "Wood-fired steakhouse on Edgar Allan Poe.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Dante+Brasa+y+Fuego+Edgar+Allan+Poe+41+Polanco+Mexico+City"}], "Drinks": [{"n": "Librería Castelar", "d": "Speakeasy behind a bookshelf, in the same building as El Japonez.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Libreria+Castelar+Emilio+Castelar+135+Polanco+Mexico+City"}, {"n": "Limantour · Polanco", "d": "Cocktail bar on Oscar Wilde.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Licoreria+Limantour+Oscar+Wilde+9+Polanco+Mexico+City"}, {"n": "Café Drama", "d": "Enter through a café. Karaoke, tarot and pizza. Wednesday to Saturday, reserve.", "t": "Reserve", "u": "https://www.google.com/maps/search/?api=1&query=Cafe+Drama+Tennyson+117+Polanco+Mexico+City"}], "Museums & shopping": [{"n": "Museo Jumex", "d": "Contemporary art, next to Soumaya.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Museo+Jumex+Mexico+City"}, {"n": "Museo Soumaya", "d": "Free, silver-tiled and six floors of art.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Museo+Soumaya+Mexico+City"}, {"n": "Antara", "d": "Open-air mall near Jumex and Soumaya.", "t": "Shopping", "u": "https://www.google.com/maps/search/?api=1&query=Antara+Fashion+Hall+Mexico+City"}, {"n": "Museo Nacional de Antropología", "d": "In Chapultepec. The big one.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Museo+Nacional+de+Antropologia+Mexico+City"}]}, "Coyoacán": {"Go": [{"n": "Casa Azul", "d": "Frida Kahlo's house. Your first visit, so book tickets ahead.", "t": "Book ahead", "u": "https://www.google.com/maps/search/?api=1&query=Museo+Frida+Kahlo+Casa+Azul+Coyoacan+Mexico+City"}, {"n": "Mercado de Coyoacán", "d": "Market food and crafts a few blocks south of Casa Azul.", "t": "", "u": "https://www.google.com/maps/search/?api=1&query=Mercado+de+Coyoacan+Mexico+City"}]}};
const INTRO={"Roma":"Your neighborhood. Everything here is walkable, with a few short rides called out.","Condesa":"Next door, around Parque México. Trendy and dressed up, not glossy.","Polanco":"Polanquito around Parque Lincoln, plus the museums on the north side.","Coyoacán":"A trek from Roma, and worth it. Pair Casa Azul with the market."};
const WHEN={"Coffee":"Morning","Breakfast":"Morning","Eat":"Lunch and dinner","Late tacos":"After midnight","Drinks":"Evening","Out late":"Night","Walk":"Afternoon","Polanquito":"Daytime","Museums & shopping":"Daytime","Go":"Half a day"};
const pin='<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
let area="Roma";
try{const a=localStorage.getItem("mx-area");if(a&&DATA[a])area=a}catch(e){}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(){
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=Object.keys(DATA).map(a=>`<button class="${a===area?'on':''}" data-a="${a}">${a}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{area=b.dataset.a;try{localStorage.setItem("mx-area",area)}catch(e){}render();window.scrollTo({top:document.querySelector(".bar").offsetTop-0,behavior:"auto"})});
  const cats=Object.keys(DATA[area]);
  document.getElementById("jump").innerHTML=cats.length>1?cats.map((c,i)=>`<a href="#s${i}">${esc(c)}</a>`).join(""):"";
  document.getElementById("intro").innerHTML=`<p class="intro">${esc(INTRO[area]||"")}</p>`;
  document.getElementById("list").innerHTML=cats.map((c,i)=>{
    const ps=DATA[area][c];
    return `<section id="s${i}"><div class="sh"><div class="num">${String(i+1).padStart(2,"0")}</div><div><h2>${esc(c)}</h2><div class="when">${esc(WHEN[c]||"")}</div></div><div class="ct">${ps.length}</div></div>`+
    ps.map(p=>`<a class="card" href="${p.u}" target="_blank" rel="noopener"><div class="body"><div class="name">${esc(p.n)}</div>${p.t?'<span class="tag">'+esc(p.t)+'</span>':''}<div class="desc">${esc(p.d)}</div></div><div class="pin">${pin}</div></a>`).join("")+`</section>`}).join("");
}
render();
</script></body></html>
